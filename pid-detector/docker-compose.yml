version: "3.9"

services:
  backend:
    build: ./backend
    container_name: pid_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/models:/app/app/models
    networks:
      - pid_network

  frontend:
    build: ./frontend
    container_name: pid_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - pid_network

networks:
  pid_network:
    driver: bridge
